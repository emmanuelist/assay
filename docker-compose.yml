services:
  db:
    image: postgres:17-alpine
    container_name: assay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: assay
      POSTGRES_DB: assay
    ports: ["5433:5432"]
    volumes: ["assay-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assay -d assay"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  assay-pgdata:
